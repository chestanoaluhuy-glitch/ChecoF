<!-- =====================================================
     LOGOUT
===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /*
         * UPDATE CART COUNT
         */

        if (
            typeof updateCartCount ===
            "function"
        ) {

            updateCartCount();

        }


        /*
         * LOGOUT BUTTON
         */

        const logoutButton =
            document.getElementById(
                "logout-button"
            );


        if (!logoutButton) {

            return;

        }


        logoutButton.addEventListener(
            "click",
            async function () {


                const confirmLogout =
                    confirm(
                        "Yakin ingin logout dari Checoff?"
                    );


                if (!confirmLogout) {

                    return;

                }


                logoutButton.disabled = true;

                logoutButton.textContent =
                    "LOGOUT...";


                try {


                    const {
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signOut();


                    if (error) {

                        throw error;

                    }


                    /*
                     * Kembali ke Login
                     */

                    window.location.href =
                        "auth/login.html";


                }
                catch (error) {


                    console.error(
                        "LOGOUT ERROR:",
                        error
                    );


                    alert(
                        "Logout gagal: " +
                        error.message
                    );


                    logoutButton.disabled =
                        false;

                    logoutButton.textContent =
                        "LOGOUT";

                }


            }
        );


    }
);

</script>
