<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Laporan Penjualan | ARDANA BATIK
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        body {
            background: #0b0b0b;
            color: #f5f0e8;
        }

        .admin-page {
            min-height: 100vh;
        }

        .admin-container {
            max-width: 1200px;
            margin: auto;
            padding: 40px 24px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 2rem;
        }

        .page-header p {
            margin: 0;
            opacity: .65;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            padding: 12px 20px;
            border: 1px solid rgba(212, 175, 55, .5);
            border-radius: 10px;
            color: #d4af37;
            text-decoration: none;
        }

        .btn-back:hover {
            background: rgba(212, 175, 55, .1);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            padding: 25px;
            background: #171717;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 16px;
        }

        .summary-card span {
            display: block;
            font-size: .8rem;
            letter-spacing: .08em;
            opacity: .6;
            margin-bottom: 12px;
        }

        .summary-card strong {
            display: block;
            font-size: 1.8rem;
            color: #d4af37;
        }

        .filter-box {
            display: flex;
            align-items: end;
            gap: 15px;
            padding: 25px;
            margin-bottom: 25px;
            background: #171717;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 16px;
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-item label {
            font-size: .8rem;
            opacity: .65;
        }

        .filter-item input {
            min-width: 180px;
            padding: 11px 13px;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 8px;
            background: #0b0b0b;
            color: #f5f0e8;
        }

        .btn-filter {
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            background: #d4af37;
            color: #0b0b0b;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-filter:hover {
            opacity: .85;
        }

        .table-wrapper {
            overflow-x: auto;
            background: #171717;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, .07);
        }

        th {
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #d4af37;
        }

        td {
            font-size: .9rem;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: .75rem;
        }

        .status-paid {
            background: rgba(80, 180, 100, .15);
            color: #7edc8b;
        }

        .status-pending {
            background: rgba(212, 175, 55, .15);
            color: #d4af37;
        }

        .status-cancelled {
            background: rgba(220, 80, 80, .15);
            color: #ff8585;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            opacity: .6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            opacity: .6;
        }

        @media (max-width: 800px) {

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filter-box {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-item input {
                width: 100%;
                box-sizing: border-box;
            }

        }

    </style>

</head>


<body>

    <div class="admin-page">

        <div class="admin-container">


            <!-- HEADER -->

            <div class="page-header">

                <div>

                    <h1>
                        Laporan Penjualan
                    </h1>

                    <p>
                        Ringkasan transaksi dan penjualan ARDANA BATIK.
                    </p>

                </div>


                <a
                    href="index.html"
                    class="btn-back"
                >
                    ← Kembali ke Dashboard
                </a>

            </div>



            <!-- SUMMARY -->

            <div class="summary-grid">

                <div class="summary-card">

                    <span>
                        TOTAL TRANSAKSI
                    </span>

                    <strong id="total-orders">
                        0
                    </strong>

                </div>


                <div class="summary-card">

                    <span>
                        PRODUK TERJUAL
                    </span>

                    <strong id="total-products">
                        0
                    </strong>

                </div>


                <div class="summary-card">

                    <span>
                        TOTAL PENDAPATAN
                    </span>

                    <strong id="total-revenue">
                        Rp 0
                    </strong>

                </div>

            </div>



            <!-- FILTER -->

            <div class="filter-box">

                <div class="filter-item">

                    <label for="start-date">
                        Dari Tanggal
                    </label>

                    <input
                        type="date"
                        id="start-date"
                    >

                </div>


                <div class="filter-item">

                    <label for="end-date">
                        Sampai Tanggal
                    </label>

                    <input
                        type="date"
                        id="end-date"
                    >

                </div>


                <button
                    class="btn-filter"
                    id="filter-button"
                >
                    Terapkan Filter
                </button>

            </div>



            <!-- TABLE -->

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                No
                            </th>

                            <th>
                                Tanggal
                            </th>

                            <th>
                                Pembeli
                            </th>

                            <th>
                                Jumlah Produk
                            </th>

                            <th>
                                Total
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody id="report-table">

                        <tr>

                            <td
                                colspan="6"
                                class="loading"
                            >
                                Memuat laporan...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


        </div>

    </div>



    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase.js"></script>


    <script>

        const tableBody =
            document.getElementById("report-table");

        const totalOrders =
            document.getElementById("total-orders");

        const totalProducts =
            document.getElementById("total-products");

        const totalRevenue =
            document.getElementById("total-revenue");


        function formatRupiah(value) {

            return new Intl.NumberFormat(
                "id-ID",
                {
                    style: "currency",
                    currency: "IDR",
                    maximumFractionDigits: 0
                }
            ).format(value || 0);

        }


        function formatDate(date) {

            return new Date(date).toLocaleDateString(
                "id-ID",
                {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            );

        }


        function getStatusClass(status) {

            const value =
                String(status || "").toLowerCase();

            if (
                value === "paid" ||
                value === "completed" ||
                value === "selesai"
            ) {

                return "status status-paid";

            }

            if (
                value === "cancelled" ||
                value === "canceled" ||
                value === "dibatalkan"
            ) {

                return "status status-cancelled";

            }

            return "status status-pending";

        }


        async function loadReports() {

            tableBody.innerHTML = `
                <tr>
                    <td colspan="6" class="loading">
                        Memuat laporan...
                    </td>
                </tr>
            `;


            const startDate =
                document.getElementById("start-date").value;

            const endDate =
                document.getElementById("end-date").value;


            let query =
                supabase
                    .from("orders")
                    .select("*")
                    .order("created_at", {
                        ascending: false
                    });


            if (startDate) {

                query =
                    query.gte(
                        "created_at",
                        `${startDate}T00:00:00`
                    );

            }


            if (endDate) {

                query =
                    query.lte(
                        "created_at",
                        `${endDate}T23:59:59`
                    );

            }


            const {
                data,
                error
            } = await query;


            if (error) {

                console.error(error);

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            Gagal memuat laporan penjualan.
                        </td>
                    </tr>
                `;

                return;

            }


            if (!data || data.length === 0) {

                totalOrders.textContent = "0";
                totalProducts.textContent = "0";
                totalRevenue.textContent = "Rp 0";

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            Belum ada transaksi.
                        </td>
                    </tr>
                `;

                return;

            }


            let productCount = 0;
            let revenue = 0;


            data.forEach(order => {

                productCount +=
                    Number(
                        order.total_items ||
                        order.quantity ||
                        0
                    );

                revenue +=
                    Number(
                        order.total_amount ||
                        order.total ||
                        0
                    );

            });


            totalOrders.textContent =
                data.length;


            totalProducts.textContent =
                productCount;


            totalRevenue.textContent =
                formatRupiah(revenue);


            tableBody.innerHTML =
                data.map(
                    (order, index) => {

                        const customer =
                            order.customer_name ||
                            order.name ||
                            order.full_name ||
                            "Pelanggan";


                        const quantity =
                            order.total_items ||
                            order.quantity ||
                            0;


                        const amount =
                            order.total_amount ||
                            order.total ||
                            0;


                        const status =
                            order.status ||
                            "pending";


                        return `

                            <tr>

                                <td>
                                    ${index + 1}
                                </td>

                                <td>
                                    ${formatDate(order.created_at)}
                                </td>

                                <td>
                                    ${customer}
                                </td>

                                <td>
                                    ${quantity}
                                </td>

                                <td>
                                    ${formatRupiah(amount)}
                                </td>

                                <td>

                                    <span class="${getStatusClass(status)}">

                                        ${status}

                                    </span>

                                </td>

                            </tr>

                        `;

                    }
                ).join("");

        }


        document
            .getElementById("filter-button")
            .addEventListener(
                "click",
                loadReports
            );


        loadReports();

    </script>

</body>

</html>
