<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Menu — Checoff Coffee Shop</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <div class="container nav-container">


        <!-- LOGO -->

        <a
            href="index.html"
            class="logo"
        >

            <img
                src="assets/images/checoff-logo.jpg"
                alt="Checoff Coffee Shop"
            >

        </a>


        <!-- NAVIGATION -->

        <nav class="nav-menu">

            <a href="index.html">
                Home
            </a>

            <a
                href="products.html"
                class="active"
            >
                Menu
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </nav>


        <!-- CART -->

        <a
            href="cart.html"
            class="cart-button"
        >

            Cart

            <span id="cart-count">
                0
            </span>

        </a>


    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main>


    <section class="featured">

        <div class="container">


            <!-- =========================
                 HEADING
            ========================= -->

            <div class="section-heading">

                <div>

                    <p class="section-label">
                        CHECOFF COFFEE SHOP
                    </p>

                    <h1>
                        OUR MENU
                    </h1>

                </div>

            </div>



            <!-- =========================
                 SEARCH
            ========================= -->

            <div class="product-search">

                <input
                    type="search"
                    id="product-search"
                    placeholder="Search menu..."
                    autocomplete="off"
                >

            </div>



            <!-- =========================
                 CATEGORY FILTER
            ========================= -->

            <div class="category-grid">


                <!-- ALL -->

                <button
                    type="button"
                    class="category-card"
                    onclick="filterProducts('all')"
                >

                    <span>
                        00
                    </span>

                    <h3>
                        ALL
                    </h3>

                    <p>
                        Semua menu
                    </p>

                </button>



                <!-- COFFEE -->

                <button
                    type="button"
                    class="category-card"
                    onclick="filterProducts('Coffee')"
                >

                    <span>
                        01
                    </span>

                    <h3>
                        COFFEE
                    </h3>

                    <p>
                        Kopi pilihan Checoff
                    </p>

                </button>



                <!-- NON COFFEE -->

                <button
                    type="button"
                    class="category-card"
                    onclick="filterProducts('Non-Coffee')"
                >

                    <span>
                        02
                    </span>

                    <h3>
                        NON-COFFEE
                    </h3>

                    <p>
                        Minuman tanpa kopi
                    </p>

                </button>



                <!-- SNACK -->

                <button
                    type="button"
                    class="category-card"
                    onclick="filterProducts('Snack')"
                >

                    <span>
                        03
                    </span>

                    <h3>
                        SNACK
                    </h3>

                    <p>
                        Teman ngopi
                    </p>

                </button>



                <!-- MERCHANDISE -->

                <button
                    type="button"
                    class="category-card"
                    onclick="filterProducts('Merchandise')"
                >

                    <span>
                        04
                    </span>

                    <h3>
                        MERCHANDISE
                    </h3>

                    <p>
                        Koleksi Checoff
                    </p>

                </button>


            </div>



            <!-- =========================
                 PRODUCT LIST
            ========================= -->

            <div
                id="product-list"
                class="product-grid"
                style="margin-top: 50px;"
            >

                <div class="loading">

                    Loading menu...

                </div>

            </div>


        </div>

    </section>


</main>



<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    <div class="container footer-container">


        <!-- FOOTER BRAND -->

        <div>


            <a
                href="index.html"
                class="logo"
            >

                <img
                    src="assets/images/checoff-logo.jpg"
                    alt="Checoff Coffee Shop"
                >

            </a>


            <p>
                Coffee, drinks & good moments.
            </p>


        </div>



        <!-- FOOTER LINKS -->

        <div class="footer-links">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Menu
            </a>

            <a href="index.html#about">
                About
            </a>

        </div>



        <!-- COPYRIGHT -->

        <div class="footer-copy">

            <p>
                © 2026 Checoff Coffee Shop.
            </p>

        </div>


    </div>

</footer>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/supabase.js"></script>



<!-- =========================
     AUTH GUARD
========================= -->

<script src="js/auth-guard.js"></script>



<!-- =========================
     PRODUCTS
========================= -->

<script src="js/products.js"></script>


</body>

</html>
