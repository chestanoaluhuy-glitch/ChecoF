<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — Checoff</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<header class="navbar">

    <div class="container nav-container">

        <!-- LOGO SAJA -->
        <a
            href="#"
            class="logo"
            onclick="return false;"
        >

            <img
                src="../assets/images/checoff-logo.jpg"
                alt="Checoff Coffee Shop"
            >

        </a>

    </div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main>

    <section class="auth-section">

        <div class="auth-container">


            <!-- =================================================
                 HEADER LOGIN
            ================================================== -->

            <div class="auth-header">

                <p class="section-label">
                    WELCOME BACK
                </p>

                <h1>
                    LOGIN
                </h1>

                <p>
                    Login untuk melanjutkan ke akun Checoff kamu.
                </p>

            </div>



            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form id="login-form">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="nama@email.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- MESSAGE -->

                <div id="login-message"></div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                >
                    LOGIN →
                </button>


            </form>



            <!-- =================================================
                 REGISTER
            ================================================== -->

            <div class="auth-footer">

                <p>

                    Belum punya akun?

                    <a href="register.html">
                        Daftar sekarang
                    </a>

                </p>

            </div>


        </div>

    </section>

</main>



<!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="auth.js"></script>


</body>

</html>
