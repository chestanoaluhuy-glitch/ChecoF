<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register — ARDANA BATIK</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        /* =========================================
           ARDANA BATIK AUTH
        ========================================= */

        .auth-section {
            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                140px 20px 80px;
        }


        .auth-container {

            width: 100%;

            max-width: 480px;

            padding: 42px;

            background:
                rgba(255, 255, 255, .025);

            border:
                1px solid
                rgba(212, 175, 55, .2);

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, .35);

        }


        /* =========================================
           HEADER
        ========================================= */

        .auth-header {

            text-align: center;

            margin-bottom: 34px;
        }


        .auth-header .section-label {

            color:
                #d4af37;

            letter-spacing:
                .2em;

            font-size: 11px;

            margin-bottom: 12px;
        }


        .auth-header h1 {

            margin-bottom: 12px;

            letter-spacing:
                .08em;
        }


        .auth-header p:last-child {

            opacity: .65;

            line-height: 1.7;

            font-size: 14px;
        }


        /* =========================================
           FORM
        ========================================= */

        #register-form {

            display: grid;

            gap: 20px;
        }


        .form-group {

            display: grid;

            gap: 8px;
        }


        .form-group label {

            font-size: 13px;

            color:
                #d4af37;

            letter-spacing:
                .04em;
        }


        .form-group input {

            width: 100%;

            padding: 15px;

            background:
                rgba(0, 0, 0, .3);

            border:
                1px solid
                rgba(212, 175, 55, .2);

            color:
                #f5f0e8;

            outline: none;

            font-family: inherit;

            transition:
                border-color .25s ease,
                box-shadow .25s ease;
        }


        .form-group input:focus {

            border-color:
                #d4af37;

            box-shadow:
                0 0 0 3px
                rgba(212, 175, 55, .08);
        }


        .form-group input::placeholder {

            color:
                rgba(245, 240, 232, .35);
        }


        /* =========================================
           MESSAGE
        ========================================= */

        #register-message {

            min-height: 20px;

            font-size: 13px;

            line-height: 1.6;
        }


        /* =========================================
           REGISTER BUTTON
        ========================================= */

        .auth-button {

            width: 100%;

            margin-top: 4px;

            cursor: pointer;
        }


        .auth-button:disabled {

            opacity: .5;

            cursor: not-allowed;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .auth-footer {

            text-align: center;

            margin-top: 28px;

            padding-top: 24px;

            border-top:
                1px solid
                rgba(212, 175, 55, .12);
        }


        .auth-footer p {

            margin: 0;

            font-size: 14px;

            opacity: .7;
        }


        .auth-footer a {

            color:
                #d4af37;

            text-decoration: none;

            font-weight: 600;
        }


        .auth-footer a:hover {

            color:
                #f0d477;

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 600px) {

            .auth-section {

                padding:
                    120px 16px 50px;
            }


            .auth-container {

                padding: 30px 22px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     NAVBAR
========================================= -->

<header class="navbar">

    <div class="container nav-container">

        <!-- LOGO SAJA -->

        <a
            href="#"
            class="logo"
            onclick="return false;"
        >

            ARDANA
            <span>BATIK</span>

        </a>

    </div>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main>

    <section class="auth-section">

        <div class="auth-container">


            <!-- =================================
                 REGISTER HEADER
            ================================== -->

            <div class="auth-header">

                <p class="section-label">
                    ARDANA BATIK
                </p>

                <h1>
                    CREATE ACCOUNT
                </h1>

                <p>
                    Buat akun untuk menikmati
                    pengalaman berbelanja
                    luxury Indonesian batik.
                </p>

            </div>



            <!-- =================================
                 REGISTER FORM
            ================================== -->

            <form id="register-form">


                <!-- NAMA -->

                <div class="form-group">

                    <label for="full-name">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="full-name"
                        placeholder="Masukkan nama lengkap"
                        autocomplete="name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="nama@email.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimal 6 karakter"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>



                <!-- MESSAGE -->

                <div id="register-message"></div>



                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                >
                    CREATE ACCOUNT →
                </button>


            </form>



            <!-- =================================
                 LOGIN LINK
            ================================== -->

            <div class="auth-footer">

                <p>

                    Sudah punya akun?

                    <a href="login.html">
                        Login di sini
                    </a>

                </p>

            </div>


        </div>

    </section>

</main>



<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="auth.js"></script>


</body>

</html>
