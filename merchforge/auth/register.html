<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register — Checoff</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<header class="navbar">

    <div class="container nav-container">

        <!-- LOGO SAJA -->

        <a
            href="#"
            class="logo"
            onclick="return false;"
        >

            <img
                src="../assets/images/checoff-logo.jpg"
                alt="Checoff Coffee Shop"
            >

        </a>

    </div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main>

    <section class="auth-section">

        <div class="auth-container">


            <!-- =================================================
                 REGISTER HEADER
            ================================================== -->

            <div class="auth-header">

                <p class="section-label">
                    JOIN CHECOFF
                </p>

                <h1>
                    CREATE ACCOUNT
                </h1>

                <p>
                    Buat akun untuk menikmati pengalaman
                    memesan di Checoff.
                </p>

            </div>



            <!-- =================================================
                 REGISTER FORM
            ================================================== -->

            <form id="register-form">


                <!-- NAMA -->

                <div class="form-group">

                    <label for="full-name">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="full-name"
                        placeholder="Masukkan nama lengkap"
                        autocomplete="name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="nama@email.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimal 6 karakter"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>



                <!-- MESSAGE -->

                <div id="register-message"></div>



                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                >
                    CREATE ACCOUNT →
                </button>


            </form>



            <!-- =================================================
                 LOGIN LINK
            ================================================== -->

            <div class="auth-footer">

                <p>

                    Sudah punya akun?

                    <a href="login.html">
                        Login di sini
                    </a>

                </p>

            </div>


        </div>

    </section>

</main>



<!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="auth.js"></script>


</body>

</html>
