<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Product Detail — ARDANA BATIK Luxury Indonesian Batik."
    >

    <title>Product Detail — ARDANA BATIK</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <header class="navbar">

        <div class="container">


            <!-- LOGO -->

            <a
                href="index.html"
                class="logo"
                aria-label="ARDANA BATIK Home"
            >

                <img
                    src="assets/images/LOGO_ARDANA BATIK.png"
                    alt="ARDANA BATIK"
                >

            </a>


            <!-- NAVIGATION -->

            <nav
                class="nav-links"
                aria-label="Main Navigation"
            >

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Collection
                </a>

                <a href="index.html#about">
                    About
                </a>

                <a href="index.html#contact">
                    Contact
                </a>

                <a href="orders.html">
                    Pesanan Saya
                </a>

            </nav>


            <!-- CART -->

            <a
                href="cart.html"
                class="cart-button"
                aria-label="Shopping Cart"
            >

                Cart

                <span id="cart-count">
                    0
                </span>

            </a>


        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- =================================================
             PRODUCT DETAIL
        ================================================== -->

        <section class="section product-detail-section">

            <div class="container">


                <!-- BACK TO COLLECTION -->

                <a
                    href="products.html"
                    class="text-link"
                    style="
                        display:inline-block;
                        margin-bottom:35px;
                    "
                >

                    ← BACK TO COLLECTION

                </a>


                <!-- PRODUCT DETAIL -->

                <div id="product-detail">

                    <div class="loading">

                        <h2>
                            Loading Product
                        </h2>

                        <p>
                            Preparing ARDANA BATIK collection...
                        </p>

                    </div>

                </div>


            </div>

        </section>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer
        class="footer"
        id="contact"
    >

        <div class="container footer-container">


            <!-- BRAND -->

            <div>

                <a
                    href="index.html"
                    class="logo"
                    aria-label="ARDANA BATIK Home"
                >

                    <img
                        src="assets/images/LOGO_ARDANA BATIK.png"
                        alt="ARDANA BATIK"
                    >

                </a>


                <p>
                    Timeless Indonesian heritage,
                    crafted for modern luxury.
                </p>

            </div>



            <!-- FOOTER NAVIGATION -->

            <div class="footer-links">

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Collection
                </a>

                <a href="index.html#about">
                    About
                </a>

                <a href="index.html#contact">
                    Contact
                </a>

                <a href="orders.html">
                    Pesanan Saya
                </a>

            </div>



            <!-- COPYRIGHT -->

            <div class="footer-copy">

                <p>
                    © 2026 ARDANA BATIK.
                </p>

                <p>
                    Luxury Indonesian Batik.
                </p>

            </div>


        </div>

    </footer>



    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script src="js/supabase.js"></script>



    <!-- =====================================================
         AUTH GUARD
    ====================================================== -->

    <script src="js/auth-guard.js"></script>



    <!-- =====================================================
         PRODUCT DETAIL
    ====================================================== -->

    <script src="js/product-detail.js"></script>


</body>

</html>
